add_bill:
  name: Add bill
  description: Add a new bill to track.
  fields:
    name:
      required: true
      example: Rent
      selector: {text: }
    due_date:
      required: true
      selector: {date: }
    frequency:
      required: true
      default: monthly
      selector:
        select:
          options: [once, weekly, monthly, yearly]
    interval:
      default: 1
      selector:
        number: {min: 1, max: 60, mode: box}
    amount:
      selector:
        number: {min: 0, step: 0.01, mode: box}
    end_date:
      selector: {date: }
    autopay:
      selector: {boolean: }
    in_budget:
      description: Count this bill in the daily budget (default on).
      default: true
      selector: {boolean: }
    remind_days_before:
      default: 3
      selector:
        number: {min: 0, max: 60, mode: box}
    biller_url:
      selector: {text: }
    notes:
      selector: {text: }
    tags:
      selector:
        text: {multiple: true}
    category:
      description: Category name or id.
      selector: {text: }

update_bill:
  name: Update bill
  description: >-
    Change details of an existing bill. Changing the due date, frequency or
    interval restarts the schedule from the new due date. Set amount,
    end_date, biller_url or notes to null to clear them.
  fields:
    bill:
      required: true
      selector: {text: }
    name:
      selector: {text: }
    amount:
      selector:
        number: {min: 0, step: 0.01, mode: box}
    due_date:
      selector: {date: }
    frequency:
      selector:
        select:
          options: [once, weekly, monthly, yearly]
    interval:
      selector:
        number: {min: 1, max: 60, mode: box}
    end_date:
      selector: {date: }
    autopay:
      selector: {boolean: }
    in_budget:
      description: Count this bill in the daily budget. Changes count from today on.
      selector: {boolean: }
    remind_days_before:
      selector:
        number: {min: 0, max: 60, mode: box}
    biller_url:
      selector: {text: }
    notes:
      selector: {text: }
    tags:
      selector:
        text: {multiple: true}
    category:
      description: Category name or id; null to make it uncategorized.
      selector: {text: }

retire_bill:
  name: Retire bill
  description: Stop tracking a bill but keep its payment history.
  fields:
    bill:
      required: true
      selector: {text: }

restore_bill:
  name: Restore bill
  description: >-
    Bring a retired bill back. Without a due date it keeps the old due date if
    that hasn't passed, otherwise uses the next date on its schedule from today.
    An end date that has already passed is cleared.
  fields:
    bill:
      required: true
      selector: {text: }
    due_date:
      selector: {date: }

mark_paid:
  name: Mark paid
  description: Record a payment for a bill's current due date and advance it.
  fields:
    bill:
      required: true
      selector: {text: }
    amount:
      selector:
        number: {min: 0, step: 0.01, mode: box}
    paid_date:
      selector: {date: }
    confirmation:
      selector: {text: }
    note:
      selector: {text: }
    update_amount:
      name: Use as new estimate
      description: Save the amount paid as the bill's amount going forward.
      default: false
      selector: {boolean: }

list_bills:
  name: List bills
  description: Return all bills.
  fields:
    include_retired:
      default: false
      selector: {boolean: }

list_payments:
  name: List payments
  description: Return payment history, newest first.
  fields:
    bill:
      selector: {text: }

send_reminders:
  name: Send reminders
  description: >-
    Fire a bills_reminder event for every bill that is overdue, due today or
    inside its reminder window. Runs automatically daily at 9:00, or on startup
    if HA was down at 9:00. Calling it by hand always sends and doesn't affect
    the daily run.

backup:
  name: Back up bills
  description: >-
    Save a copy of all bills and payments to /config/bills_backups/ now.
    Daily copies are also made automatically (the last 14 are kept).

list_backups:
  name: List backups
  description: List the backup files in /config/bills_backups/, newest first.

restore_backup:
  name: Restore backup
  description: >-
    Replace all bills and payments with a backup file from
    /config/bills_backups/. A safety copy of the current data is saved first.
  fields:
    file:
      required: true
      example: bills-2026-11-18.json
      selector: {text: }

add_category:
  name: Add category
  description: Add a bill category with an icon.
  fields:
    name:
      required: true
      example: Utilities
      selector: {text: }
    icon:
      default: mdi:tag
      selector: {icon: }

update_category:
  name: Update category
  description: Rename a category or change its icon.
  fields:
    category:
      required: true
      selector: {text: }
    name:
      selector: {text: }
    icon:
      selector: {icon: }

delete_category:
  name: Delete category
  description: Delete a category. Its bills become uncategorized.
  fields:
    category:
      required: true
      selector: {text: }

list_categories:
  name: List categories
  description: Return all categories with how many active bills use each.

cost_summary:
  name: Cost summary
  description: >-
    Paid, upcoming and total for bills due this month, this year (and each of
    its months) and every previous year with data, by category. Counted by
    due date.

bill_history:
  name: Bill history
  description: >-
    One bill's payments (newest due date first) with stats: average, lowest,
    highest, the last payment's change, the recent trend and year over year.
  fields:
    bill:
      required: true
      selector: {text: }

budget_setup:
  name: Set up budget
  description: >-
    Start (or restart) the daily budget. Days before the start date don't
    count; transactions are kept.
  fields:
    start_date:
      description: Defaults to today. Can't be in the future.
      selector: {date: }
    starting_amount:
      description: Spending money you're starting with (can be negative).
      default: 0
      selector:
        number: {step: 0.01, mode: box}
    starting_savings:
      description: Savings you already have.
      default: 0
      selector:
        number: {min: 0, step: 0.01, mode: box}

add_expense:
  name: Add expense
  description: Spend from the budget. Returns the transaction and today's budget.
  fields:
    amount:
      required: true
      selector:
        number: {min: 0.01, step: 0.01, mode: box}
    category:
      description: Category name or id.
      selector: {text: }
    note:
      description: Defaults to the category name.
      selector: {text: }
    date:
      description: Defaults to today.
      selector: {date: }

add_income:
  name: Add one-off income
  description: Add money to the budget on a day (today by default).
  fields:
    amount:
      required: true
      selector:
        number: {min: 0.01, step: 0.01, mode: box}
    category:
      selector: {text: }
    note:
      selector: {text: }
    date:
      selector: {date: }

move_to_savings:
  name: Move to savings
  description: Take an amount from the budget and add it to savings.
  fields:
    amount:
      required: true
      selector:
        number: {min: 0.01, step: 0.01, mode: box}
    note:
      selector: {text: }
    date:
      selector: {date: }

take_from_savings:
  name: Take from savings
  description: Take an amount out of savings and add it to the budget.
  fields:
    amount:
      required: true
      selector:
        number: {min: 0.01, step: 0.01, mode: box}
    note:
      selector: {text: }
    date:
      selector: {date: }

delete_transaction:
  name: Delete transaction
  description: Remove an expense, income or savings move.
  fields:
    transaction:
      required: true
      selector: {text: }

add_recurring:
  name: Add recurring income or savings
  description: >-
    Recurring income adds to every day's budget; a savings plan comes out of
    it. Every 2 weeks is frequency weekly with interval 2.
  fields:
    type:
      required: true
      selector:
        select:
          options: [income, savings]
    amount:
      required: true
      selector:
        number: {min: 0.01, step: 0.01, mode: box}
    frequency:
      required: true
      default: weekly
      selector:
        select:
          options: [weekly, monthly, yearly]
    interval:
      default: 1
      selector:
        number: {min: 1, max: 52, mode: box}
    name:
      selector: {text: }
    category:
      selector: {text: }
    start_date:
      selector: {date: }
    end_date:
      description: Leave empty for open-ended.
      selector: {date: }

update_recurring:
  name: Update recurring income or savings
  description: Change it from today on. Set end_date to null to make it open-ended.
  fields:
    recurring:
      required: true
      selector: {text: }
    name:
      selector: {text: }
    amount:
      selector:
        number: {min: 0.01, step: 0.01, mode: box}
    frequency:
      selector:
        select:
          options: [weekly, monthly, yearly]
    interval:
      selector:
        number: {min: 1, max: 52, mode: box}
    category:
      selector: {text: }
    start_date:
      selector: {date: }
    end_date:
      selector: {date: }

delete_recurring:
  name: Delete recurring income or savings
  description: Stop it from today on. Days already past keep what it added.
  fields:
    recurring:
      required: true
      selector: {text: }

budget_summary:
  name: Budget summary
  description: >-
    Today's budget, the next two days, today's allowance, savings totals,
    recurring income and savings plans, and recent transactions.

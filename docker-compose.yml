services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-test
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      - ./custom_components/bills:/config/custom_components/bills